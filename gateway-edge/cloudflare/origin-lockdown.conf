# Optional origin lockdown: only Cloudflare + private networks may reach the gateway.
# Enable in production when the origin is NOT reachable except via orange-cloud DNS.
# Uncomment the include in gateway-locations.conf (CLOUDFLARE_ORIGIN_LOCKDOWN).

allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
allow 127.0.0.1;
include cloudflare/allow-cloudflare.conf;
deny all;
