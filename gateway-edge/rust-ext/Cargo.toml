[package]
name        = "rust_ext"
version     = "0.5.0"
edition     = "2021"
description = "Ultra-scale API Gateway — NGINX FFI hot-path extension"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"
strip         = true
debug         = false

[dependencies]
# Lock-free config hot-swap (~2 ns read)
arc-swap     = "1.6.0"

# O(1) Radix Tree routing
matchit      = "0.7.3"

# Serialization
serde        = { version = "1.0.228", features = ["derive"] }
serde_json   = "1.0.149"

# Base64 for JWT decode
base64       = "0.22.1"

# HMAC-SHA256 JWT signature verification
hmac         = "0.12.1"
sha2         = "0.10.8"

# Lazy statics
lazy_static  = "1.5.0"

# HTTP client removed — config polling moved to sidecar

# Lock-free concurrent structures
crossbeam    = "0.8.4"

# Deterministic fast hashing
rustc-hash   = "1.1.0"

# Cross-process shared memory for global state
memmap2      = "0.9.4"

# Aho-Corasick multi-pattern WAF — single pass, zero heap alloc
aho-corasick = "1.1.3"

# LRU cache for auth token eviction
lru          = "0.12.3"

# Redis client — revocation lookups on cache miss (not hot-path cached hits)
redis        = { version = "0.26.1", features = ["tcp_nodelay", "tls-native-tls"] }

[dev-dependencies]
