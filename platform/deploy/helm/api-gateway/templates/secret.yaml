{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: {{ include "api-gateway.namespace" . }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret must be set" .Values.secrets.jwtSecret | quote }}
  ADMIN_API_KEY: {{ required "secrets.adminApiKey must be set" .Values.secrets.adminApiKey | quote }}
  CONFIG_READ_TOKEN: {{ required "secrets.configReadToken must be set" .Values.secrets.configReadToken | quote }}
  {{- if .Values.secrets.jwtKeys }}
  # kid→secret rotation keys (JSON). Secret material — never on the config wire (ADR-0005/0013).
  JWT_KEYS: {{ .Values.secrets.jwtKeys | toJson | quote }}
  {{- end }}
  {{- if .Values.redis.password }}
  # Redis credentials are secrets — kept here, never in the ConfigMap (ADR-0013).
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}
  {{- end }}
{{- end }}
