apiVersion: v1
kind: ConfigMap
metadata:
  name: uam-frontend-nginx
  namespace: {{ include "uam.namespace" . }}
  labels:
    {{- include "uam.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes auto;
    events { worker_connections 1024; }
    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        sendfile      on;
        server_tokens off;
        server {
            listen 80;
            server_name _;
            server_tokens off;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            root /usr/share/nginx/html;
            index index.html;
            location / {
                try_files $uri $uri/ /index.html;
            }
            location /api/ {
                proxy_pass {{ .Values.frontend.gatewayProxyUrl }}/api/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_http_version 1.1;
                proxy_read_timeout 60s;
            }
        }
    }
