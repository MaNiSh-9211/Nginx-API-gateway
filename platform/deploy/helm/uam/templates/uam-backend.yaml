apiVersion: apps/v1
kind: Deployment
metadata:
  name: uam-backend
  namespace: {{ include "uam.namespace" . }}
  labels:
    app: uam-backend
    {{- include "uam.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: uam-backend
  template:
    metadata:
      labels:
        app: uam-backend
        {{- include "uam.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: uam-backend
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: uam-backend-env
          env:
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: uam-secrets
                  key: JWT_ACCESS_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: uam-secrets
                  key: JWT_REFRESH_SECRET
            - name: PASSWORD_PEPPER
              valueFrom:
                secretKeyRef:
                  name: uam-secrets
                  key: PASSWORD_PEPPER
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: uam-secrets
                  key: ADMIN_API_KEY
            {{- if .Values.redis.password }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uam-secrets
                  key: REDIS_PASSWORD
            {{- end }}
            {{- if .Values.secrets.googleClientSecret }}
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: uam-secrets
                  key: GOOGLE_CLIENT_SECRET
            {{- end }}
            {{- if .Values.secrets.githubClientSecret }}
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: uam-secrets
                  key: GITHUB_CLIENT_SECRET
            {{- end }}
            {{- if .Values.smtp.password }}
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: uam-secrets
                  key: SMTP_PASS
            {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: uam-backend
  namespace: {{ include "uam.namespace" . }}
  labels:
    app: uam-backend
    {{- include "uam.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: uam-backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
