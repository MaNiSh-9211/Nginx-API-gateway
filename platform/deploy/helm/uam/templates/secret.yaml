{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: uam-secrets
  namespace: {{ include "uam.namespace" . }}
  labels:
    {{- include "uam.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_ACCESS_SECRET: {{ required "secrets.jwtAccessSecret must match gateway JWT_SECRET" .Values.secrets.jwtAccessSecret | quote }}
  JWT_REFRESH_SECRET: {{ required "secrets.jwtRefreshSecret must be set" .Values.secrets.jwtRefreshSecret | quote }}
  PASSWORD_PEPPER: {{ required "secrets.passwordPepper must be set" .Values.secrets.passwordPepper | quote }}
  ADMIN_API_KEY: {{ required "secrets.adminApiKey must be set" .Values.secrets.adminApiKey | quote }}
  MONGO_ROOT_PASSWORD: {{ required "secrets.mongoRootPassword must be set" .Values.secrets.mongoRootPassword | quote }}
  {{- if .Values.redis.password }}
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}
  {{- end }}
  {{- if .Values.secrets.googleClientSecret }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.githubClientSecret }}
  GITHUB_CLIENT_SECRET: {{ .Values.secrets.githubClientSecret | quote }}
  {{- end }}
  {{- if .Values.smtp.password }}
  SMTP_PASS: {{ .Values.smtp.password | quote }}
  {{- end }}
{{- end }}
