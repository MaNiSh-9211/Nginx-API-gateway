# ============================================================
# Prometheus — base dev stack (gateway + control plane + infra)
# UAM targets: use prometheus.full.yml via docker-compose.uam.yml
# ============================================================

global:
  scrape_interval:     5s
  evaluation_interval: 5s
  scrape_timeout:      4s
  external_labels:
    cluster: 'api-gateway'
    env:     'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "rules/*.yml"

scrape_configs:

  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:8080']
    metrics_path: '/metrics'
    scheme: http

  - job_name: 'control-plane'
    static_configs:
      - targets: ['control-plane:8081']
    metrics_path: '/metrics'
    scheme: http

  - job_name: 'config-sidecar'
    static_configs:
      - targets: ['config-sidecar:9092']
    metrics_path: '/'
    scheme: http

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    metrics_path: '/metrics'
    scheme: http
