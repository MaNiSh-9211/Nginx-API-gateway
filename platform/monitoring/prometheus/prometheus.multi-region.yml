# ============================================================
# Prometheus — multi-region dev stack
# ============================================================

global:
  scrape_interval:     5s
  evaluation_interval: 5s
  scrape_timeout:      4s
  external_labels:
    cluster: 'api-gateway-multi-region'
    env:     'development'

rule_files:
  - "rules/*.yml"

scrape_configs:

  - job_name: 'gateway-eu'
    static_configs:
      - targets: ['gateway-eu:8080']
        labels:
          region: 'EU'
    metrics_path: '/metrics'
    scheme: http

  - job_name: 'gateway-us'
    static_configs:
      - targets: ['gateway-us:8080']
        labels:
          region: 'US'
    metrics_path: '/metrics'
    scheme: http

  - job_name: 'gateway-ap'
    static_configs:
      - targets: ['gateway-ap:8080']
        labels:
          region: 'AP'
    metrics_path: '/metrics'
    scheme: http

  - job_name: 'control-plane'
    static_configs:
      - targets: ['control-plane:8081']
    metrics_path: '/metrics'
    scheme: http

  - job_name: 'config-sidecar'
    static_configs:
      - targets: ['config-sidecar:9092']
    metrics_path: '/'
    scheme: http

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    metrics_path: '/metrics'
    scheme: http
