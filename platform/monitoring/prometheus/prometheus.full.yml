# ============================================================
# Prometheus — full dev stack (base + UAM + MongoDB + nginx)
# Mounted when docker-compose.uam.yml overlay is active.
# ============================================================

global:
  scrape_interval:     5s
  evaluation_interval: 5s
  scrape_timeout:      4s
  external_labels:
    cluster: 'api-gateway'
    env:     'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "rules/*.yml"

scrape_configs:

  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:8080']
    metrics_path: '/metrics'
    scheme: http

  - job_name: 'control-plane'
    static_configs:
      - targets: ['control-plane:8081']
    metrics_path: '/metrics'
    scheme: http

  - job_name: 'config-sidecar'
    static_configs:
      - targets: ['config-sidecar:9092']
    metrics_path: '/'
    scheme: http

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    metrics_path: '/metrics'
    scheme: http

  - job_name: 'uam-backend'
    static_configs:
      - targets: ['uam-backend:8080']
    metrics_path: '/metrics'
    scheme: http

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']
    metrics_path: '/metrics'
    scheme: http

  - job_name: 'uam-frontend-nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
    metrics_path: '/metrics'
    scheme: http
