# ============================================================
# Gateway alert rules — metrics contract as of v1.1.x
#
# Metric names verified against gateway-edge /metrics:
#   gateway_requests_total      counter (edge, SHM aggregate)
#   gateway_requests_5xx_total  counter
#   gateway_latency_us_bucket        histogram
#   gateway_active_health_up         gauge   {upstream=...}   (ADR-0061)
#   gateway_auth_snapshot_age_seconds gauge  (ADR-0054)
#   uam_redis_circuit_state          gauge   {job="uam-backend"}
#
# Import into Grafana Cloud: Alerting → Alert rules → Prometheus rules
# → upload this file (or point your cloud agent's rule_files at it).
# Local prometheus picks it up automatically via prometheus.local.yml.
# ============================================================
groups:
  - name: gateway_availability
    rules:

      - alert: GatewayHighErrorRate
        expr: |
          sum(rate(gateway_requests_5xx_total[5m]))
            / clamp_min(sum(rate(gateway_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Gateway 5xx ratio > 5% for 5m"
          description: "Edge error ratio {{ $value | humanizePercentage }} (SLO target < 1%)."

      - alert: GatewayEdgeDown
        expr: up{job="gateway-edge"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "gateway-edge scrape down"
          description: "Prometheus cannot reach gateway-edge /metrics."

      - alert: GatewayP99LatencyBreach
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(gateway_latency_us_bucket[5m]))
          ) > 100000
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Gateway P99 latency > 100 ms for 10 m"
          description: "P99 = {{ $value | humanizeDuration }}."

  # ── SLO burn-rate (99.9% availability → error budget 0.1%) ──────────────
  # Multi-window pair: page when burning budget ≥14.4× on 1h AND ≥14.4× on 5m;
  # ticket when ≥6× on 6h AND ≥6× on 30m. Standard Google-SRE shape.
  - name: gateway_slo_burn_rate
    rules:

      - alert: GatewaySLOBurnRatePage
        expr: |
          (
            sum(rate(gateway_requests_5xx_total[1h]))
              / clamp_min(sum(rate(gateway_requests_total[1h])), 1e-9)
          ) > (14.4 * 0.001)
          and
          (
            sum(rate(gateway_requests_5xx_total[5m]))
              / clamp_min(sum(rate(gateway_requests_total[5m])), 1e-9)
          ) > (14.4 * 0.001)
        for: 2m
        labels:
          severity: critical
          team: platform
          slo: availability-99.9
        annotations:
          summary: "SLO fast-burn: paging threshold crossed"
          description: "Availability budget burning ≥14.4× — will exhaust in <2 days at this rate."

      - alert: GatewaySLOBurnRateTicket
        expr: |
          (
            sum(rate(gateway_requests_5xx_total[6h]))
              / clamp_min(sum(rate(gateway_requests_total[6h])), 1e-9)
          ) > (6 * 0.001)
          and
          (
            sum(rate(gateway_requests_5xx_total[30m]))
              / clamp_min(sum(rate(gateway_requests_total[30m])), 1e-9)
          ) > (6 * 0.001)
        for: 15m
        labels:
          severity: warning
          team: platform
          slo: availability-99.9
        annotations:
          summary: "SLO slow-burn: ticket threshold crossed"
          description: "Availability budget burning ≥6× — investigate within days."

  # ── Dependency health (ADR-0054 / ADR-0061) ──────────────────────────────
  - name: gateway_dependencies
    rules:

      - alert: UpstreamActivelyUnhealthy
        expr: gateway_active_health_up == 0
        for: 3m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Upstream failing active health probes: {{ $labels.upstream }}"
          description: "Active prober has marked this upstream DOWN for 3+ minutes."

      - alert: AuthRevocationSnapshotStale
        expr: gateway_auth_snapshot_age_seconds > 60
        for: 5m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "Edge revocation snapshot is stale (>60s)"
          description: "Worker cannot reach Redis for auth deltas; with REVOCATION_FAIL_CLOSED=1 auth will fail closed."

      - alert: UamRedisCircuitOpenLong
        expr: uam_redis_circuit_state == 1
        for: 10m
        labels:
          severity: warning
          team: identity
        annotations:
          summary: "uam-backend Redis circuit OPEN >10m"
          description: "Distributed rate limiting degraded; check Upstash connectivity."
