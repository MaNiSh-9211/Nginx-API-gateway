# ============================================================
# Kernel Tuning — Ultra-Scale API Gateway
# Apply with: sysctl -p /etc/sysctl.d/99-gateway-tuning.conf
# ============================================================

# ── TCP Connection Handling ──────────────────────────────────
# Increase the maximum number of open file descriptors
fs.file-max = 2097152
fs.nr_open = 2097152

# TCP listen backlog — must match nginx tcp-backlog
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535

# Increase socket receive/send buffers (for high-throughput)
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.core.rmem_default = 65536
net.core.wmem_default = 65536
net.ipv4.tcp_rmem = 4096 87380 134217728
net.ipv4.tcp_wmem = 4096 65536 134217728

# ── TIME_WAIT Recycling ──────────────────────────────────────
# Reuse TIME_WAIT sockets for new connections
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 10
net.ipv4.tcp_max_tw_buckets = 2000000

# ── Connection Tracking ──────────────────────────────────────
net.netfilter.nf_conntrack_max = 2000000
net.netfilter.nf_conntrack_tcp_timeout_established = 600
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 10

# ── Ephemeral Port Range ─────────────────────────────────────
net.ipv4.ip_local_port_range = 1024 65535

# ── TCP Fast Open ────────────────────────────────────────────
net.ipv4.tcp_fastopen = 3

# ── Keepalive ────────────────────────────────────────────────
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 6

# ── Network Device Queue ─────────────────────────────────────
net.core.netdev_max_backlog = 65535
net.core.netdev_budget = 600

# ── Memory ───────────────────────────────────────────────────
# Disable transparent huge pages for predictable latency
# (set in /etc/rc.local or systemd unit: echo never > /sys/kernel/mm/transparent_hugepage/enabled)
vm.swappiness = 1
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# ── NUMA ─────────────────────────────────────────────────────
kernel.numa_balancing = 0
