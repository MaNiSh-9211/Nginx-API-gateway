# ============================================================
# System Limits — Ultra-Scale API Gateway
# Place in /etc/security/limits.d/99-gateway.conf
# ============================================================

# Allow gateway process to open millions of file descriptors
gateway         soft    nofile          2097152
gateway         hard    nofile          2097152
gateway         soft    nproc           unlimited
gateway         hard    nproc           unlimited

# Root (for Docker / systemd managed processes)
root            soft    nofile          2097152
root            hard    nofile          2097152

# Wildcard fallback
*               soft    nofile          1048576
*               hard    nofile          1048576
