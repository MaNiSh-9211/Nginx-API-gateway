# Prometheus — local dev stack scrape config
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: gateway-edge
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway-edge:8080"]

  - job_name: control-plane
    metrics_path: /metrics
    static_configs:
      - targets: ["control-plane:8081"]

  - job_name: uam-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["uam-backend:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
