# Local dev additions: self-contained Redis + Prometheus.
# redis.conf mount from multi-region.yml is not required here (defaults are fine).

services:
  redis:
    image: redis:7-alpine
    command: redis-server --save 20 1 --loglevel warning
    networks:
      - internal
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    networks:
      - internal
    volumes:
      - ./prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
      - ../platform/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  redis-data:
  prometheus-data:
