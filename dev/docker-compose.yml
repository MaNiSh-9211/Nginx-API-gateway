version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

services:

  # ── Gateway Edge (NGINX + Rust FFI) ────────────────────────────────────────
  gateway-edge:
    build:
      context: ../gateway-edge
      dockerfile: Dockerfile
    image: gateway-edge:latest
    ports:
      - "${GATEWAY_PORT}:8080"
    networks:
      - internal
      - public
    depends_on:
      control-plane:
        condition: service_healthy
    environment:
      # Non-secret config
      GATEWAY_REGION: ${GATEWAY_REGION}
      FALLBACK_REGION: ${FALLBACK_REGION}
      GATEWAY_CONFIG_PATH: /etc/gateway/config.json
      CONTROL_PLANE_URL: http://control-plane:8081
      CONFIG_POLL_SECS: "5"
      AUTH_CACHE_TTL_SECS: "30"
      LOG_LEVEL: warn
      METRICS_PORT: "0"
      REVOCATION_FAIL_CLOSED: "1"
      GATEWAY_REFUSE_INSECURE_SECRETS: "1"
      TLS_ENABLED: "false"
      TLS_CERT_PATH: /etc/nginx/certs/server.crt
      TLS_KEY_PATH: /etc/nginx/certs/server.key
      # ── mTLS (ADR-0067): set + mount certs to enable ──
      # Client verification (clients → gateway):
      MTLS_CLIENT_VERIFY: ${MTLS_CLIENT_VERIFY:-}
      MTLS_CLIENT_CA_FILE: ${MTLS_CLIENT_CA_FILE:-}
      # Upstream client cert (gateway → backends):
      UPSTREAM_MTLS_CERT: ${UPSTREAM_MTLS_CERT:-}
      UPSTREAM_MTLS_KEY: ${UPSTREAM_MTLS_KEY:-}
      UPSTREAM_MTLS_CA_FILE: ${UPSTREAM_MTLS_CA_FILE:-}
      # Secrets — resolved from dev/.env
      JWT_SECRET: ${JWT_SECRET}
      CONFIG_READ_TOKEN: ${CONFIG_READ_TOKEN}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_TLS: ${REDIS_TLS}
      REDIS_DB: "0"
      # Grafana Cloud OTLP
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    restart: unless-stopped
    logging: *default-logging

  # ── Gateway Control Plane (Rust / Actix) ───────────────────────────────────
  control-plane:
    build:
      context: ../gateway-control-plane
      dockerfile: Dockerfile
    image: control-plane:latest
    ports:
      - "127.0.0.1:${CONTROL_PLANE_PORT}:8081"
    networks:
      - internal
    environment:
      # Non-secret config
      PORT: "8081"
      HOST: "0.0.0.0"
      CONFIG_DIR: /app/conf.d
      CONFIG_HISTORY_LIMIT: "20"
      MAX_CONCURRENCY: "50000"
      RUST_LOG: info
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: "1"
      # Cloud Postgres (Aiven) — config revisions / audit history
      DATABASE_URL: ${CP_DATABASE_URL}
      PG_SSL: "true"
      # Grafana Cloud OTLP
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      # Secrets — resolved from dev/.env
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      CONFIG_READ_TOKEN: ${CONFIG_READ_TOKEN}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ../gateway-control-plane/conf.d:/app/conf.d
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  # ── Config Sidecar (Rust / Push Daemon) ────────────────────────────────────
  config-sidecar:
    build:
      context: ../gateway-sidecar
      dockerfile: Dockerfile
    image: config-sidecar:latest
    networks:
      - internal
    environment:
      CONTROL_PLANE_URL: http://control-plane:8081
      GATEWAY_CONFIG_PATH: /etc/gateway/config.json
      CONFIG_POLL_SECS: "5"
      CONFIG_READ_TOKEN: ${CONFIG_READ_TOKEN}
      METRICS_PORT: "9092"
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # ── UAM Backend (Node / Express) ────────────────────────────────────────────
  uam-backend:
    build:
      context: ../uam-backend
      dockerfile: Dockerfile
    image: uam-backend:latest
    networks:
      - internal
    environment:
      # Non-secret config
      PORT: "8080"
      NODE_ENV: ${NODE_ENV}
      JWT_ISSUER: api-gateway-auth-server
      JWT_AUDIENCE: api-gateway-clients
      AUTO_VERIFY_EMAIL: ${AUTO_VERIFY_EMAIL}
      BCRYPT_COST: ${BCRYPT_COST}
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE}
      DEFAULT_HOME_REGION: ${UAM_DEFAULT_HOME_REGION}
      AUTH_OMIT_REFRESH_IN_BODY: "true"
      # Prefer IPv4 DNS: Docker bridges lack IPv6 egress and Node tries AAAA
      # first — OTLP exports to Grafana Cloud would time out.
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      REDIS_ENABLED: "true"
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: "0"
      SMTP_PORT: ${SMTP_PORT}
      UAM_DEV_STACK: "1"
      UAM_REFUSE_INSECURE_SECRETS: "0"
      UAM_REQUIRE_DISTRIBUTED_RATE_LIMIT: "1"
      # sslmode=no-verify: Aiven uses a self-signed chain; TLS stays on, chain
      # verification off — works across every node-pg version.
      DATABASE_URL: ${UAM_DATABASE_URL}
      # node-pg needs this to apply rejectUnauthorized:false (Aiven uses a
      # self-signed chain); without it sslmode=verify-full fails at connect.
      PG_SSL: "true"
      PGSSLROOTCERT: /run/secrets/ssl-ca-cert
      # Secrets — resolved from dev/.env
      MONGODB_URI: ${MONGODB_URI}
      JWT_ACCESS_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CLIENT_URL: ${UAM_CLIENT_URL}
      # Grafana Cloud OTLP
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      CONTROL_PLANE_URL: http://control-plane:8081
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  # ── UAM Frontend (React → nginx) ────────────────────────────────────────────
  uam-frontend:
    build:
      context: ../uam-frontend
      dockerfile: Dockerfile
    image: uam-frontend:latest
    ports:
      - "${UAM_FRONTEND_PORT}:80"
    networks:
      - internal
      - public
    environment:
      VITE_API_URL: /api
      # scheme://host:port only — the /api/ path prefix comes from $request_uri
      GATEWAY_PROXY_BASE: http://gateway-edge:8080
      GATEWAY_PROXY_HOST: gateway-edge
    depends_on:
      gateway-edge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging

  # ── Demo Backend (Node / Express) ───────────────────────────────────────────
  demo-backend:
    build:
      context: ../demo-backend
      dockerfile: Dockerfile
    image: demo-backend:latest
    networks:
      - internal
    environment:
      # Non-secret config
      PORT: "8080"
      NODE_ENV: ${NODE_ENV}
      JWT_ISSUER: api-gateway-auth-server
      JWT_AUDIENCE: api-gateway-clients
      AUTH_DEV_TOKENS: ${AUTH_DEV_TOKENS}
      BCRYPT_COST: "12"
      SERVICE_REGION: ${SERVICE_REGION}
      USER_STORE_PATH: /app/data/users.json
      # Secrets — resolved from dev/.env
      JWT_SECRET: ${JWT_SECRET}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging

  # ── Demo Frontend (nginx static) ────────────────────────────────────────────
  demo-frontend:
    build:
      context: ../demo-frontend
      dockerfile: Dockerfile
    image: demo-frontend:latest
    ports:
      - "${FRONTEND_TEST_PORT}:80"
    networks:
      - internal
      - public
    environment:
      GATEWAY_INTERNAL_HOST: gateway-edge
      GATEWAY_INTERNAL_PORT: "8080"
      # Browser-facing URL (baked into runtime-config.js). Must be reachable
      # from the HOST browser — container names like http://uam-frontend only
      # resolve inside the Docker network.
      UAM_FRONTEND_URL: http://localhost:${UAM_FRONTEND_PORT}
    depends_on:
      gateway-edge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped
    logging: *default-logging

secrets:
  ssl-ca-cert:
    file: ./ca.crt

networks:
  internal:
  public:
