# ==============================================================================
# uam-backend/compose.yaml — standalone smoke-test only
# ==============================================================================
# For full stack use dev/docker-compose.yml instead.
#
# Usage:
#   cp uam-backend/.env.example uam-backend/.env
#   Fill in your values in uam-backend/.env
#   docker compose up --build
#
# All credentials come from uam-backend/.env (gitignored).
# NO secrets are hardcoded in this file.
# ==============================================================================

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-uam}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uam} -d ${POSTGRES_DB:-uam}"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  uam-backend:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped