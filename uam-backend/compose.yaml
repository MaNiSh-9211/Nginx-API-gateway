# ==============================================================================
# uam-backend/compose.yaml — standalone smoke-test only
# ==============================================================================
# For full stack use dev/docker-compose.yml instead.
#
# Usage:
#   cp uam-backend/.env.example uam-backend/.env
#   Fill in your values in uam-backend/.env
#   docker compose up --build
#
# All credentials come from uam-backend/.env (gitignored).
# NO secrets are hardcoded in this file.
# ==============================================================================

services:

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  uam-backend:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # Override MongoDB host to the local container
      MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/uam?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
